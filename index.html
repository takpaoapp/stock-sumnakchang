<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- ป้องกันการดีเลย์ 300ms ของเบราว์เซอร์มือถือด้วย touch-action: manipulation -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระบบบริหารคลังและขอเบิกพัสดุ - สำนักช่าง</title>
    
    <!-- HD Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f3efe6;
            touch-action: manipulation; /* ปลดล็อคการแตะทันที 0ms บนมือถือ */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif;
        }
        #appFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: 0;
            outline: none;
            display: block;
            touch-action: manipulation;
            z-index: 10;
        }
        #loadingOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f3efe6;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(41, 37, 36, 0.15);
            border-top-color: #292524;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="margin-top: 16px; font-weight: 700; color: #292524; font-size: 15px;">
            ระบบบริหารคลังและขอเบิกพัสดุ
        </div>
        <div style="margin-top: 6px; color: #78716c; font-size: 13px;">
            กำลังเชื่อมต่อฐานข้อมูล สำนักช่าง...
        </div>
    </div>

    <iframe 
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwXSGV8gcjoPexYTqV9bPC2jBxpoUYnb934F5FcQe9_qoi-wubSB5gZmqVZWWejf_ogqA/exec?v=175" 
        frameborder="0"
        scrolling="yes"
        loading="eager"
        onload="const o = document.getElementById('loadingOverlay'); if(o) o.style.display='none';"
        allow="geolocation; camera; microphone; clipboard-read; clipboard-write; autoplay; fullscreen">
    </iframe>
</body>
</html>
