<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- ป้องกันการดีเลย์ 300ms ของเบราว์เซอร์มือถือด้วย touch-action: manipulation -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ระบบบริหารคลังและขอเบิกพัสดุ - สำนักช่าง</title>
    
    <!-- HD Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f3efe6;
            touch-action: manipulation; /* ปลดล็อคการแตะทันที 0ms บนมือถือ */
        }
        #appFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            border: 0;
            outline: none;
            display: block;
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <iframe 
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbwXSGV8gcjoPexYTqV9bPC2jBxpoUYnb934F5FcQe9_qoi-wubSB5gZmqVZWWejf_ogqA/exec?v=44" 
        frameborder="0"
        scrolling="yes"
        loading="eager"
        allow="geolocation; camera; microphone; clipboard-read; clipboard-write; autoplay; fullscreen"
        allowfullscreen>
    </iframe>
</body>
</html>
